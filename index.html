<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PureVitality — Premium Wellness & AI Voice Shopping</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
  <!-- E-commerce Storefront Header -->
  <header class="store-header">
    <div class="header-inner">
      <a href="#" class="store-logo">
        <div class="store-logo-icon">🌿</div>
        <span>PureVitality</span>
      </a>

      <div class="header-actions">
        <span id="authStatus" class="auth-badge">👤 Guest (Sign in)</span>
        <button class="cart-button" title="View Cart">
          <span>🛒 Cart</span>
          <span id="cartCounter" class="cart-counter">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Storefront Main Content -->
  <main class="store-main">
    <div class="hero-banner">
      <h1>Natural Skincare & Wellness</h1>
      <p>
        Experience hands-free, real-time voice shopping. Ask about products, variants, ingredients, and pricing in English, Hindi, or Hinglish.
      </p>
    </div>

    <!-- Verified Product Catalog (On-Demand Retrieval) -->
    <div id="productsGrid" class="products-grid">
      <!-- Populated dynamically from verified storeCatalog.ts -->
    </div>

    <!-- Test & Verification Prompts (Collapsible minimal footer for instant verification) -->
    <div style="margin-top: 3.5rem; padding: 1.25rem; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <span style="font-size: 0.8rem; font-weight: 700; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase;">
          Voice Assistant Interaction Prompts (Sections 11, 12, 16, 19, 25)
        </span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
        <button class="quick-test-chip" data-query="I need something for skin care" style="padding: 0.35rem 0.75rem; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 9999px; font-size: 0.8rem; cursor: pointer;">
          "I need something for skin care"
        </button>
        <button class="quick-test-chip" data-query="Something for acne" style="padding: 0.35rem 0.75rem; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 9999px; font-size: 0.8rem; cursor: pointer;">
          "Something for acne"
        </button>
        <button class="quick-test-chip" data-query="Mujhe koi skincare product chahiye" style="padding: 0.35rem 0.75rem; background: #f0fdf4; border: 1px solid #86efac; border-radius: 9999px; font-size: 0.8rem; color: #166534; cursor: pointer;">
          🇮🇳 Hindi: "Mujhe koi skincare product chahiye"
        </button>
        <button class="quick-test-chip" data-query="60 pills kitne ka hai?" style="padding: 0.35rem 0.75rem; background: #f0fdf4; border: 1px solid #86efac; border-radius: 9999px; font-size: 0.8rem; color: #166534; cursor: pointer;">
          🇮🇳 Hinglish: "60 pills kitne ka hai?"
        </button>
        <button class="quick-test-chip" data-query="Which one is cheaper?" style="padding: 0.35rem 0.75rem; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 9999px; font-size: 0.8rem; cursor: pointer;">
          Context: "Which one is cheaper?"
        </button>
        <button class="quick-test-chip" data-query="Yes, add it to my cart" style="padding: 0.35rem 0.75rem; background: #eff6ff; border: 1px solid #93c5fd; border-radius: 9999px; font-size: 0.8rem; color: #1e40af; cursor: pointer;">
          Cart: "Yes, add it to my cart"
        </button>
        <button class="quick-test-chip" data-query="How much is shipping?" style="padding: 0.35rem 0.75rem; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 9999px; font-size: 0.8rem; cursor: pointer;">
          Policy: "How much is shipping?"
        </button>
        <button class="quick-test-chip" data-query="Wait, what is the price?" style="padding: 0.35rem 0.75rem; background: #fffbeb; border: 1px solid #fde68a; border-radius: 9999px; font-size: 0.8rem; color: #92400e; cursor: pointer;">
          ⚡ Interruption: "Wait, what is the price?"
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
